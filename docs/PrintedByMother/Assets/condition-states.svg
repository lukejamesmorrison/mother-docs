<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 791 1234" width="100%" role="img" aria-labelledby="t d">
<title id="t">Print job states and the predicates true in each</title>
<desc id="d">State diagram. States: Idle (idle): No print job targets the projector. Starting (busy): A job targets the projector and has not committed yet. Printing, no welding pass (busy printing): Committed, no pass open yet. The stall clock runs from the commit. Welding (busy printing welding): The welders are adding integrity; every change resets the stall clock. Stalled (busy printing welding stalled): The welders are on a block but its integrity is not rising, usually a component shortage. No hook fires. Timed out (busy printing timedout): The weld timeout tripped and welding has not progressed since. Paused (busy printing paused): printer/pause holds the print clocks; welding can stay true. Complete (busy complete): The projection is complete; the job is clearing or finishing. Transitions: Idle to Starting, fires onPrint; Starting to Printing, no welding pass, no hook, job commits; Printing, no welding pass to Welding, fires onWeldStart; Welding to Printing, no welding pass, fires onWeldEnd; Welding to Stalled, no hook, no progress &gt; maxWeldGap, block partly built; Stalled to Welding, no hook, integrity rises or block count changes; Stalled to Timed out, fires onTimedOut; Printing, no welding pass to Timed out, fires onTimedOut; Timed out to Welding, fires onWeldStart; Printing, no welding pass to Paused, no hook, printer/pause; Welding to Paused, no hook, printer/pause; Stalled to Paused, no hook, printer/pause; Timed out to Paused, no hook, printer/pause; Paused to Printing, no welding pass, no hook, printer/resume; Paused to Welding, no hook, printer/resume; Paused to Stalled, no hook, printer/resume; Paused to Timed out, no hook, printer/resume; Welding to Complete, fires onWeldEnd, onComplete; Printing, no welding pass to Complete, fires onComplete; Timed out to Complete, fires onComplete; Printing, no welding pass to Complete, no hook, already complete at commit; Complete to Idle, fires onClear; Starting to Idle, fires onFailed; Printing, no welding pass to Idle, fires onFailed; Welding to Idle, fires onFailed; Stalled to Idle, fires onFailed; Timed out to Idle, fires onFailed; Paused to Idle, fires onFailed; Complete to Idle, fires onFailed;</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#a9a9b8" stroke-width="1.6"/></marker></defs>
